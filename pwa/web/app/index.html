<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff0f6">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; frame-src https://www.youtube.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>PeraGym</title>
  <link rel="stylesheet" href="style.css?v=3.1.0">
  <link rel="manifest" href="/manifest.webmanifest?v=3.1.0">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3.1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script type="module" src="app.js?v=3.1.0"></script>
  <script src="/pwa.js?v=3.1.0" defer></script>
</head>
<body>
  <div id="loading" class="loading-screen" role="status" aria-label="Carregando seus treinos">
    <div class="loading-cassette" aria-hidden="true"><img src="/assets/cassette.svg" alt=""><span class="tape-wheel wheel-left"></span><span class="tape-wheel wheel-right"></span></div>
    <h1 class="loading-brand">PeraGym</h1><span class="loading-kicker">VICE TRAINING</span>
    <div class="loading-meter" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <p>Carregando...</p>
  </div>
  <div class="app-shell" id="app" hidden>
    <header class="topbar">
      <a class="brand" href="#inicio" aria-label="PeraGym início"><span class="brand-title">PeraGym</span><span class="brand-caption">VICE TRAINING</span></a>
      <div class="header-actions"><button class="icon-button" data-install aria-label="Instalar PeraGym"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/></svg></button><button id="settings-open" class="icon-button" aria-label="Abrir ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8ZM9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1Z"/></svg></button><button id="theme-toggle" class="theme-toggle" role="switch" aria-checked="false" aria-label="Ativar tema escuro"><span class="toggle-track"><span class="toggle-thumb"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 1v2m0 18v2M1 12h2m18 0h2M4.2 4.2l1.4 1.4m12.8 12.8 1.4 1.4m0-15.6-1.4 1.4M5.6 18.4l-1.4 1.4"/></svg></span><span class="moon">☾</span></span></button></div>
    </header>
    <main id="main" tabindex="-1"></main>
    <aside id="music-deck" class="music-deck" aria-label="Player de música" hidden>
      <header class="music-deck-head"><strong>YouTube</strong><button type="button" class="icon-button" data-music-close aria-label="Parar e fechar player">×</button></header>
      <div data-music-frame class="music-frame"></div>
      <p data-music-status class="music-status" role="status" aria-live="polite"></p>
      <a data-music-source href="https://music.youtube.com/" target="_blank" rel="noopener">Abrir no YouTube Music ↗</a>
    </aside>
    <nav class="bottom-nav" aria-label="Navegação principal">
      <button data-page="inicio" class="nav-item active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>Início</span></button>
      <button data-page="fichas" class="nav-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5H5v16h14V5h-4M9 3h6v4H9Zm-1 9h8m-8 4h6"/></svg><span>Minhas fichas</span></button>
      <button data-page="evolucao" class="nav-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18M7 15l4-5 4 3 5-7"/></svg><span>Evolução</span></button>
      <button data-page="historico" class="nav-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.4 7M3 4v7h7m2-4v6l4 2"/></svg><span>Histórico</span></button>
      <button data-page="musica" class="nav-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13M9 8l12-2"/><ellipse cx="6" cy="18" rx="3" ry="3"/><ellipse cx="18" cy="16" rx="3" ry="3"/></svg><span>Música</span></button>
    </nav>
  </div>
  <dialog id="editor" aria-labelledby="editor-title"><form id="workout-form">
    <div class="dialog-head"><div><span class="eyebrow">FICHA DE TREINO</span><h2 id="editor-title">Nova ficha de treino</h2></div><button type="button" class="icon-button" id="close-editor" aria-label="Fechar editor">×</button></div>
    <div class="form-content">
      <label>Nome da ficha<input name="name" placeholder="Ex.: Treino A — Superiores" required maxlength="100" autocomplete="off"></label>
      <label>Foco muscular<input name="focus" placeholder="Ex.: Peito, ombros e tríceps" maxlength="100"></label>
      <label>Dias da semana<input name="days" placeholder="Ex.: Segunda e quinta" maxlength="100"></label>
      <div class="section-heading"><h3>Exercícios</h3><span id="exercise-count" class="small-label"></span></div>
      <div id="exercise-fields"></div>
      <button type="button" id="add-exercise" class="button secondary full">+ Adicionar exercício</button>
      <label class="notes-label">Observações da ficha<textarea name="notes" rows="3" maxlength="1000" placeholder="Orientações do treino."></textarea></label>
      <p class="form-hint">Carga em quilos. Use 0 para exercícios sem carga externa.</p>
    </div>
    <footer class="dialog-footer"><button type="button" id="cancel-editor" class="button secondary">Cancelar</button><button type="submit" class="button primary">Salvar ficha <img src="/assets/cassette.svg" class="cassette-icon" alt="" aria-hidden="true"></button></footer>
  </form></dialog>
  <dialog id="confirm" aria-labelledby="confirm-title"><div class="confirm-content"><span class="confirm-icon">!</span><h2 id="confirm-title"></h2><p id="confirm-message"></p><div class="confirm-actions"><button class="button secondary" id="confirm-no">Cancelar</button><button class="button primary" id="confirm-yes">Confirmar</button></div></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
